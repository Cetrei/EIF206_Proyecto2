name: Entrega

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pruebas
        timeout-minutes: 6
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 3
          openbox &
          sleep 2
          (sleep 100; echo '=== volcado de hilos ==='; jps -l; for p in $(jps -q); do echo "--- pid $p"; jstack $p | grep -A25 '"main"\|AWT-EventQueue\|AWT-XAWT'; done) &
          vigilante=$!
          set +e
          mvn -B verify
          estado=$?
          kill $vigilante 2>/dev/null
          exit $estado

      - name: Armar el zip
        run: |
          mkdir dist
          git archive --format=zip --prefix=EIF206_Proyecto2/ -o dist/EIF206_Proyecto2.zip HEAD

      - name: Comprobar que el zip compila desde cero
        run: |
          mkdir comprobar
          unzip -q dist/EIF206_Proyecto2.zip -d comprobar
          cd comprobar/EIF206_Proyecto2
          mvn -B -DskipTests package
          test -f backend/target/backend-1.0-SNAPSHOT.jar
          test -f frontend/target/frontend-1.0-SNAPSHOT.jar
          test -f base_datos.sql

      - uses: actions/upload-artifact@v4
        with:
          name: EIF206_Proyecto2
          path: dist/EIF206_Proyecto2.zip
