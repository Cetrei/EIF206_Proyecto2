name: Entrega

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pruebas
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a mvn -B verify

      - name: Armar el zip
        run: |
          mkdir dist
          git archive --format=zip --prefix=EIF206_Proyecto2/ -o dist/EIF206_Proyecto2.zip HEAD

      - name: Comprobar que el zip compila desde cero
        run: |
          mkdir comprobar
          unzip -q dist/EIF206_Proyecto2.zip -d comprobar
          cd comprobar/EIF206_Proyecto2
          mvn -B -DskipTests package
          test -f backend/target/backend-1.0-SNAPSHOT.jar
          test -f frontend/target/frontend-1.0-SNAPSHOT.jar
          test -f base_datos.sql

      - uses: actions/upload-artifact@v4
        with:
          name: EIF206_Proyecto2
          path: dist/EIF206_Proyecto2.zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete entrega --cleanup-tag --yes || true
          gh release create entrega dist/EIF206_Proyecto2.zip --target "$GITHUB_SHA" --title "Entrega" --notes "Zip generado desde el commit $GITHUB_SHA"
